<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B3A2B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B2A1B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8922F;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="10" y="10" width="180" height="180" rx="36" ry="36" fill="url(#bgGrad)"/>
  <!-- Decorative corner ornaments -->
  <path d="M30,30 L50,30 L50,34 L34,34 L34,50 L30,50 Z" fill="url(#goldGrad)" opacity="0.7"/>
  <path d="M170,30 L150,30 L150,34 L166,34 L166,50 L170,50 Z" fill="url(#goldGrad)" opacity="0.7"/>
  <path d="M30,170 L50,170 L50,166 L34,166 L34,150 L30,150 Z" fill="url(#goldGrad)" opacity="0.7"/>
  <path d="M170,170 L150,170 L150,166 L166,166 L166,150 L170,150 Z" fill="url(#goldGrad)" opacity="0.7"/>
  <!-- Thin decorative border inside -->
  <rect x="18" y="18" width="164" height="164" rx="30" ry="30" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4"/>
  <!-- Arabic letter Meem (م) - stylized -->
  <text x="100" y="128" font-family="'Amiri', 'Times New Roman', serif" font-size="96" font-weight="bold" text-anchor="middle" fill="white" opacity="0.95">م</text>
  <!-- Subtle bottom text -->
  <text x="100" y="168" font-family="'Playfair Display', serif" font-size="11" font-weight="400" text-anchor="middle" fill="url(#goldGrad)" letter-spacing="3" opacity="0.85">ALMAZAR</text>
</svg>
